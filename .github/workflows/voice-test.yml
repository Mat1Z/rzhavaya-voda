name: Voice test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/voice_test.py"
      - ".github/workflows/voice-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Voice a test line
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/voice_test.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/voice || true
          git commit -m "Voice test results [skip ci]" || echo "nothing to commit"
          git pull --rebase -q && git push
